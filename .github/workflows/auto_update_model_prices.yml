name: Auto Update Model Prices

on:
  schedule:
    # 每周日 UTC 00:00 运行
    - cron: "0 0 * * 0"
  workflow_dispatch:
    # 允许手动触发

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update model prices
        run: python scripts/sync_models.py --output update

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/model_prices.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(models): auto-update model prices from OpenRouter"
          title: "[Auto] Update model prices - ${{ github.run_id }}"
          body: |
            ## Automated Model Price Update

            This PR was automatically generated by the model price sync workflow.

            **Source:** OpenRouter API
            **Date:** ${{ github.event.repository.updated_at }}

            ### Changes
            - Updated model pricing information
            - Added any new models from OpenRouter

            ### Review Checklist
            - [ ] Verify pricing changes are reasonable
            - [ ] Check for any removed models
            - [ ] Ensure no breaking changes

            ---
            *This PR was created automatically by GitHub Actions*
          branch: auto-update-model-prices
          delete-branch: true
          labels: |
            automated
            models
            pricing
