[workspace]
resolver = "2"
members = [
    "crates/litellm-contracts",
    "crates/litellm-provider-core",
    "crates/litellm-providers",
    "crates/litellm-router",
    "crates/litellm-api",
    "crates/litellm-gateway",
    "apps/gateway",
    "apps/google-gateway",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["lifcc"]
repository = "https://github.com/majiayu000/litellm-rs"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
